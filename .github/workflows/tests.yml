name: Run Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Check formatting with black
      run: black --check tools/ tests/ main.py

    - name: Lint with flake8
      run: flake8 tools/ tests/ main.py

    - name: Start server
      run: |
        python main.py &
        timeout 10 bash -c 'while ! nc -z localhost 5000; do sleep 1; done'

    - name: Run tests
      run: pytest tests/ --cov=tools --cov-report=term

    - name: Kill server
      run: pkill -f "python main.py" || true


  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_PAT }}

    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ghcr.io/pasha-iden/library_v2.0:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v3

    - name: Copy docker-compose to server
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.TIMEWEB_HOST }}
        username: ${{ secrets.TIMEWEB_USER }}
        password: ${{ secrets.TIMEWEB_PASSWORD }}
        source: "docker-compose.prod.yml"
        target: "/opt/library-app"
        overwrite: true

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.TIMEWEB_HOST }}
        username: ${{ secrets.TIMEWEB_USER }}
        password: ${{ secrets.TIMEWEB_PASSWORD }}
        script: |
          sudo chown root:root /opt/library-app/docker-compose.prod.yml || true
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          cd /opt/library-app
          docker-compose -f docker-compose.prod.yml pull
          docker-compose -f docker-compose.prod.yml up -d
          docker image prune -f