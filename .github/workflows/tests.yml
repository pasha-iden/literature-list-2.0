name: Run Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Check formatting with black
      run: black --check tools/ tests/ main.py

    - name: Lint with flake8
      run: flake8 tools/ tests/ main.py

    - name: Start server
      run: |
        python main.py &
        timeout 10 bash -c 'while ! nc -z localhost 1001; do sleep 1; done'

    - name: Run tests
      run: pytest tests/ --cov=tools --cov-report=term

    - name: Kill server
      run: pkill -f "python main.py" || true